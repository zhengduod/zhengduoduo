<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>质量守恒定律 · 沉浸式虚拟实验室</title>
<style>
:root{
  --card:#ffffff; --line:#e3eaf0; --txt:#3a4c5e; --txt-strong:#22323f;
  --muted:#6f8395; --primary:#4a9db0; --amber:#b7832f; --green:#2f8f6b; --red:#bf5754;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6;
  background-color:#f3f7f8;
  background-image:
    radial-gradient(1000px 520px at 8% -12%, #e2eff2 0%, transparent 62%),
    radial-gradient(820px 460px at 100% 0%, #eff3e6 0%, transparent 58%),
    linear-gradient(180deg,#f0f6f7 0%, #f5f8f4 55%, #f8f6f0 100%);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:600px;margin:0 auto;padding:0 16px 56px;position:relative}

#topbar{
  display:none;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 0 10px;position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,rgba(243,247,248,.98) 65%,rgba(243,247,248,0));
  backdrop-filter:blur(6px);flex-wrap:wrap;
}
#topbar.on{display:flex}
.hud{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.score-chip{
  font-size:13px;font-weight:700;color:#a9722b;background:#fdf5e8;
  border:1px solid #f2e3c8;padding:7px 13px;border-radius:20px;white-space:nowrap;
}
.score-chip b{font-size:15px}

.btn{
  border:1px solid var(--line);background:#fff;color:var(--txt);
  padding:9px 13px;border-radius:12px;font-size:13px;font-weight:600;
  cursor:pointer;transition:.18s;font-family:inherit;white-space:nowrap;
}
.btn:active{transform:scale(.96);background:#f6fafb}
.btn.primary{
  width:100%;padding:14px;border:none;margin-top:12px;
  background:linear-gradient(135deg,#5aadbd,#3f8b9d);color:#fff;
  font-size:15.5px;font-weight:700;letter-spacing:.5px;
  box-shadow:0 8px 20px rgba(74,157,176,.26);border-radius:14px;
}
.btn.primary:active{transform:scale(.98)}
.btn.primary:disabled{opacity:.65;cursor:wait;transform:none}
.btn.soft{
  width:100%;padding:13px;margin-top:10px;border-radius:14px;
  background:#f2f8fa;border:1px solid #d8e6eb;color:#3b7c8c;font-size:14px;font-weight:600;
}
.btn.mini{padding:6px 10px;font-size:12px;border-radius:10px}

.screen{display:none;animation:fadeUp .3s ease both}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{text-align:center;padding:46px 0 26px}
.hero h1{font-size:25px;letter-spacing:.5px;color:var(--txt-strong);font-weight:800}
.hero .sub{color:var(--muted);font-size:13px;margin-top:10px;letter-spacing:1.5px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
  box-shadow:0 8px 26px rgba(90,120,140,.08);
}
.card label{font-size:13px;color:var(--muted);display:block;margin-bottom:10px}
input[type=text]{
  width:100%;padding:14px 16px;border-radius:13px;border:1px solid #dde6ec;
  background:#f8fbfc;color:var(--txt-strong);font-size:16px;outline:none;
  transition:.2s;font-family:inherit;
}
input:focus{border-color:#7cc0cf;background:#fff;box-shadow:0 0 0 3px rgba(90,173,189,.13)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;line-height:1.7}

.home-head{text-align:center;padding:16px 0 20px}
.home-head h1{font-size:21px;color:var(--txt-strong);font-weight:800;letter-spacing:.5px}
.home-head p{font-size:13px;color:var(--muted);margin-top:8px}
.home-head .who{font-size:12px;color:#4a9db0;margin-top:8px;font-weight:600}
.task-list{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.task-card{
  display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:18px;
  background:#fff;border:1px solid var(--line);cursor:pointer;transition:.2s;
  box-shadow:0 5px 18px rgba(90,120,140,.07);position:relative;overflow:hidden;
}
.task-card:active{transform:scale(.985)}
.task-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:#cfdde4;transition:.25s;
}
.task-card.done::before{background:linear-gradient(180deg,#4a9db0,#2f8f6b)}
.task-icon{
  width:48px;height:48px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:24px;
  background:#f2f8fa;border:1px solid #e0eef2;
}
.task-main{flex:1;min-width:0}
.task-name{font-size:11px;color:#4a9db0;font-weight:700;letter-spacing:1px}
.task-title{font-size:15.5px;font-weight:800;color:var(--txt-strong);margin:2px 0 4px}
.task-desc{font-size:12.5px;color:var(--muted);line-height:1.6}
.task-status{
  position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:9px;background:#f0f3f6;color:#8a9aa8;
}
.task-status.ok{background:#eef8f2;color:#2f8f6b}

.task-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.task-badge{
  font-size:11px;font-weight:800;color:#fff;background:#5aadbd;
  padding:4px 11px;border-radius:9px;letter-spacing:1px;
}
.task-head h2{font-size:17px;color:var(--txt-strong);font-weight:800}

.story{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;
  font-size:13.5px;line-height:1.9;color:var(--txt);margin-bottom:14px;
  box-shadow:0 4px 14px rgba(90,120,140,.05);
}
.story p+p{margin-top:10px}
.story b{color:#3a7f8e}

.input-table{
  width:100%;border-collapse:separate;border-spacing:0;background:#fff;
  border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 4px 14px rgba(90,120,140,.05);margin-bottom:14px;font-size:13px;
}
.input-table th{
  background:#f2f8fa;color:#3b7c8c;font-weight:700;font-size:12.5px;
  padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);
}
.input-table td{
  padding:11px 12px;border-bottom:1px solid #eef2f5;vertical-align:top;
  color:var(--txt);line-height:1.7;
}
.input-table tr:last-child td{border-bottom:none}
.input-table td:first-child{
  width:30%;font-weight:700;color:var(--txt-strong);background:#fafcfd;font-size:12.5px;
}
.input-table textarea{
  width:100%;min-height:56px;padding:9px 11px;border-radius:10px;
  border:1px solid #dde6ec;background:#f8fbfc;color:var(--txt-strong);
  font-size:13.5px;line-height:1.65;outline:none;resize:vertical;font-family:inherit;
  transition:.18s;
}
.input-table textarea:focus{border-color:#7cc0cf;background:#fff;
  box-shadow:0 0 0 3px rgba(90,173,189,.12)}
.input-table textarea::placeholder{color:#a9b8c4}

.fill-block{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;
  box-shadow:0 4px 14px rgba(90,120,140,.05);margin-bottom:14px;
  font-size:14px;line-height:2.2;color:var(--txt);
}
.fill-block .fill-title{
  font-size:12px;font-weight:800;color:#4a9db0;letter-spacing:1px;margin-bottom:8px;
}
select{
  padding:8px 11px;border-radius:10px;border:1.5px solid #cfdde4;background:#f8fbfc;
  color:var(--txt-strong);font-size:13.5px;font-family:inherit;outline:none;
  transition:.18s;max-width:100%;
}
select:focus{border-color:#7cc0cf;background:#fff}
select.ok{border-color:#a9d8c2;background:#f2fbf6;color:#22785a;font-weight:700}
select.bad{border-color:#e5b3b0;background:#fdf4f3;color:#a54440}

.bench{
  min-height:250px;display:flex;align-items:flex-end;justify-content:center;
  padding:22px 10px 12px;border-radius:18px;margin-bottom:14px;
  background:linear-gradient(180deg,#ffffff,#f7fbfc);
  border:1px solid var(--line);position:relative;overflow:hidden;
  box-shadow:0 6px 20px rgba(90,120,140,.07);
}
.bench::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:46px;
  background:linear-gradient(180deg,transparent,rgba(74,157,176,.06));pointer-events:none;
}
.drop-zone{
  width:100%;min-height:120px;border:2px dashed #a9cfd9;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:#4a8b9a;font-size:13px;background:#f4fafb;transition:.2s;padding:16px;
}
.drop-zone.drop-hover{border-color:#e0a94d;background:#fdf7ea;color:#b7832f}
.dz-icon{font-size:30px}

.scale{position:relative;width:100%;height:250px}
.scale-arm{
  position:absolute;left:50%;top:48px;width:240px;margin-left:-120px;height:8px;
  background:linear-gradient(90deg,#9aa9b6,#dbe4ea,#9aa9b6);border-radius:4px;
  transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 2px 6px rgba(90,120,140,.18);
}
.scale-column{position:absolute;left:50%;bottom:32px;width:12px;height:104px;margin-left:-6px;
  background:linear-gradient(180deg,#b7c5d0,#8d9dab);border-radius:6px}
.scale-base{position:absolute;left:50%;bottom:18px;width:148px;height:16px;margin-left:-74px;
  background:linear-gradient(180deg,#b7c5d0,#7f909f);border-radius:9px;
  box-shadow:0 6px 14px rgba(90,120,140,.22)}
.pan{position:absolute;top:10px;width:110px;height:152px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:2px}
.pan.left{left:-25px}
.pan.right{right:-25px}
.pan-plate{width:98px;height:10px;border-radius:50%;
  background:linear-gradient(180deg,#d7e1e8,#9aa9b6);box-shadow:0 4px 10px rgba(90,120,140,.2)}
.pan-hint{font-size:11px;color:#4a8b9a;border:1.5px dashed #a9cfd9;
  border-radius:10px;padding:8px 10px;background:#f4fafb;text-align:center;line-height:1.5}
.weight{width:40px;height:34px;border-radius:5px;background:linear-gradient(160deg,#a9b8c4,#7d8d9c);
  font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;
  box-shadow:0 3px 8px rgba(90,120,140,.22)}

.beaker{position:relative;width:72px;height:72px;border:2px solid #8fbed0;
  border-top:none;border-radius:0 0 10px 10px;background:rgba(180,220,235,.22);
  transition:transform .7s ease}
.beaker.drop-hover{border-color:#e0a94d;background:#fdf7ea;box-shadow:0 0 0 3px rgba(224,169,77,.18)}
.beaker .powder{position:absolute;left:3px;right:3px;bottom:2px;height:20px;
  background:linear-gradient(180deg,#fdfefe,#dbe5ec);border-radius:0 0 8px 8px;opacity:.95}
.beaker .tube{position:absolute;left:50%;bottom:6px;width:16px;height:52px;margin-left:-8px;
  border:2px solid #a9bcc9;border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,rgba(150,205,225,.65),rgba(150,205,225,.35));
  display:flex;align-items:flex-end;justify-content:center;font-size:8px;color:#3a7f8e}

.observe-stage{position:relative;width:100%;height:236px;
  display:flex;align-items:flex-end;justify-content:center}
.gas-escape{position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none}
.gas-escape i{
  position:absolute;bottom:0;font-size:11px;color:#8a9aa8;font-weight:800;
  font-style:normal;animation:escapeUp 2.3s linear infinite;opacity:0;letter-spacing:.5px;
}
@keyframes escapeUp{
  0%{transform:translateY(0) scale(.85);opacity:0}
  22%{opacity:.9}
  100%{transform:translateY(-88px) scale(1.12);opacity:0}
}
.big-beaker{
  position:relative;width:112px;height:112px;
  border:3px solid #8fbed0;border-top:none;border-radius:0 0 14px 14px;
  background:rgba(180,220,235,.22);transform:rotate(-14deg);
  transform-origin:bottom center;margin-bottom:32px;
}
.big-beaker .big-powder{
  position:absolute;left:6px;right:6px;bottom:4px;height:26px;
  background:linear-gradient(180deg,#fdfefe,#dbe5ec);border-radius:0 0 12px 12px;opacity:.95;
}
.big-beaker .big-tube{
  position:absolute;left:50%;bottom:8px;width:20px;height:66px;margin-left:-10px;
  border:2px solid #a9bcc9;border-radius:0 0 10px 10px;
  background:linear-gradient(180deg,rgba(150,205,225,.7),rgba(150,205,225,.35));
  transform:rotate(34deg);transform-origin:bottom center;
  font-size:9px;color:#3a7f8e;display:flex;align-items:flex-end;justify-content:center;
}
.bubbles{position:absolute;inset:0;overflow:hidden;border-radius:0 0 14px 14px}
.bubbles i{position:absolute;bottom:6px;width:9px;height:9px;border-radius:50%;
  background:rgba(150,195,220,.85);animation:riseBig 1.7s linear infinite}
@keyframes riseBig{
  0%{transform:translateY(0) scale(.6);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-95px) scale(1.1);opacity:0}
}

.flask-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding-top:86px}
.flask-wrap.drop-hover{filter:drop-shadow(0 0 10px rgba(224,169,77,.55))}
.flask{width:132px;height:158px;display:block}
.balloon-slot{
  position:absolute;left:50%;transform:translateX(-50%);bottom:150px;
  width:104px;height:86px;display:flex;align-items:flex-end;justify-content:center;
  z-index:4;border-radius:14px;transition:.2s;
}
.slot-hint{
  font-size:11px;color:#c06660;border:1.5px dashed #dfa6a2;border-radius:10px;
  padding:6px 10px;background:#fdf2f1;white-space:nowrap;transition:.18s;pointer-events:none;
}
.balloon-slot.drop-hover .slot-hint{
  color:#b7832f;border-color:#e0a94d;background:#fdf7ea;transform:scale(1.08);
}
.balloon{
  width:0;height:0;opacity:0;pointer-events:none;border-radius:50% 50% 46% 46%;
  background:radial-gradient(circle at 34% 28%,#f0a9a6,#d96b67 65%,#b04a47);
  box-shadow:0 0 18px rgba(217,107,103,.32);
}
.balloon.inflated{animation:balloonPop .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes balloonPop{
  0%{width:0;height:0;opacity:0}
  65%{width:74px;height:74px;opacity:1}
  100%{width:66px;height:66px;opacity:1}
}
.flask-inner{position:absolute;left:0;right:0;bottom:14px;display:flex;
  justify-content:center;align-items:flex-end;gap:6px;pointer-events:none}
.flask-powder{width:52px;height:16px;border-radius:0 0 10px 10px;
  background:linear-gradient(180deg,#fdfefe,#dbe5ec);opacity:.95}
.flask-tube{width:16px;height:56px;border:2px solid #a9bcc9;border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,rgba(150,205,225,.7),rgba(150,205,225,.35));
  font-size:8px;color:#3a7f8e;display:flex;align-items:flex-end;justify-content:center}
.flask-bubbles{position:absolute;left:50%;bottom:20px;width:64px;height:70px;
  margin-left:-32px;overflow:hidden;pointer-events:none}
.flask-bubbles i{position:absolute;bottom:0;width:8px;height:8px;border-radius:50%;
  background:rgba(150,195,220,.85);animation:riseBig 1.5s linear infinite}

.balance-badge{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:20px;
  font-size:14px;font-weight:700;background:#eef8f2;border:1.5px solid #b9e0cd;color:#2f8f6b;
}

.tray{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;
  border-radius:15px;background:#fff;border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--txt);cursor:grab;transition:.18s;
  touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 3px 10px rgba(90,120,140,.06);
}
.tile:active{transform:scale(.96)}
.tile.selected{border-color:#e0a94d;background:#fdf7ea;box-shadow:0 0 0 3px rgba(224,169,77,.16)}
.tile.dragging{opacity:.32}
.tile .ti{font-size:26px;line-height:1;pointer-events:none}
.tile span{pointer-events:none}
.drag-ghost{
  position:fixed;z-index:9999;pointer-events:none;opacity:.94;
  transform:rotate(-4deg) scale(1.05);border-radius:15px;background:#e8f4f8;
  border:2px solid var(--primary);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;font-size:12.5px;
  font-weight:600;color:var(--txt-strong);box-shadow:0 14px 30px rgba(90,120,140,.3);
}

.observe-tip{
  margin:12px 0 4px;padding:14px 16px;border-radius:14px;background:#fdf7ea;
  border:1px solid #f0dcbc;color:#a9722b;font-size:13.5px;text-align:center;
  line-height:1.7;font-weight:600;
}
.result-note{
  margin-top:12px;padding:16px;border-radius:14px;font-size:13.5px;line-height:1.85;
  background:#eef8f2;border:1px solid #c8e6d6;color:#33715a;
}
.result-note b{color:#22785a}
.result-note.warn{background:#fdf5e8;border-color:#f0dcbc;color:#9a6a28}
.result-note.warn b{color:#a9722b}
.step-title{
  font-size:14px;font-weight:700;color:var(--txt-strong);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.step-title .badge{
  font-size:11px;font-weight:700;color:#fff;background:#5aadbd;
  padding:3px 9px;border-radius:8px;letter-spacing:.5px;
}

.q-card{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;
  margin-bottom:12px;box-shadow:0 4px 14px rgba(90,120,140,.06);
}
.q-title{font-size:14.5px;font-weight:700;line-height:1.65;display:flex;gap:10px;
  margin-bottom:12px;color:var(--txt-strong)}
.q-no{flex:0 0 22px;height:22px;border-radius:7px;background:#5aadbd;color:#fff;
  font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  padding:12px 14px;border-radius:12px;border:1px solid #e3eaf0;background:#fafcfd;
  font-size:13.5px;line-height:1.55;color:var(--txt);cursor:pointer;transition:.18s;
}
.opt:active{transform:scale(.985)}
.opt.correct{background:#eef8f2;border-color:#a9d8c2;color:#22785a;font-weight:600}
.opt.wrong{background:#fdf0ef;border-color:#e5b3b0;color:#a54440}
.opt.locked{cursor:default}
.q-hint{
  margin-top:12px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.75;
  background:#fdf7ea;border-left:3px solid #e0a94d;color:#96702f;
}
.q-hint.ok{background:#eef8f2;border-left-color:#2f8f6b;color:#22785a}

.rank-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.rank-head .t{font-size:16px;font-weight:800;color:var(--txt-strong)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2f8f6b;
  margin-right:6px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rank-row{
  display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;
  background:#fff;border:1px solid var(--line);margin-bottom:9px;
  box-shadow:0 3px 10px rgba(90,120,140,.05);
}
.rank-row.me{border-color:#a9d4de;background:#f4fbfc}
.rank-no{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:800;background:#eef2f5;
  color:#6f8395;flex:0 0 auto}
.rank-no.g1{background:#f7e5b8;color:#8a6516}
.rank-no.g2{background:#e3eaf0;color:#5b6d7c}
.rank-no.g3{background:#f2ddca;color:#8a5a2e}
.rank-name{flex:1;font-size:14px;font-weight:600;color:var(--txt-strong);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rank-sub{font-size:11px;color:var(--muted);flex:0 0 auto}
.rank-score{font-size:15px;font-weight:800;color:#b0762d;flex:0 0 auto;
  min-width:52px;text-align:right}

.mon-head{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:12px;
}
.mon-head .t{font-size:16px;font-weight:800;color:var(--txt-strong)}

function blankState(name){
  return {
    name: name, score: 0, awarded: {}, ans: {}, opErrors: [],
    t1: { v1:'', v2:'', v3:'', v4:'', s1:'', s2:'' },
    t3: { polished:false, balance:false, flask:false, solution:false,
          tube:false, stopper:false, m1:null, reacted:false, m2:null,
          phen:'', concl:'' },
    t6: { stage:'setup1',
          l1:{ balance:false, beaker:false, powder:false, tube:false },
          l2:{ flask:false, powder:false, tube:false, balloon:false },
          done:false },
    t7: { a:'', b:'' },
    ts: 0
  };
}

function normalizeState(o, name){
  const base = blankState(name);
  const m = Object.assign(base, o || {});
  m.name = name;
  m.t1 = Object.assign(base.t1, (o && o.t1) || {});
  m.t3 = Object.assign(base.t3, (o && o.t3) || {});
  m.t6 = Object.assign(base.t6, (o && o.t6) || {});
  m.t6.l1 = Object.assign(base.t6.l1, (o && o.t6 && o.t6.l1) || {});
  m.t6.l2 = Object.assign(base.t6.l2, (o && o.t6 && o.t6.l2) || {});
  m.t7 = Object.assign(base.t7, (o && o.t7) || {});
  m.ans = (o && o.ans) || {};
  m.awarded = (o && o.awarded) || {};
  m.opErrors = (o && o.opErrors) || [];
  m.ts = (o && o.ts) || 0;
  return m;
}

function hasContent(st){
  if(!st) return false;
  if((st.score || 0) !== 0) return true;
  if(Object.keys(st.ans || {}).length) return true;
  const t1 = st.t1 || {}, t3 = st.t3 || {}, t7 = st.t7 || {};
  if(t1.v1 || t1.v2 || t1.v3 || t1.v4 || t1.s1 || t1.s2) return true;
  if(t3.phen || t3.concl || t3.polished || t3.m1 !== null) return true;
  if(t7.a || t7.b) return true;
  if(st.t6){
    const l1 = st.t6.l1 || {}, l2 = st.t6.l2 || {};
    if(l1.balance || l1.beaker || l2.flask || l2.balloon) return true;
  }
  return false;
}

function save(){
  if(!S) return;
  S.ts = Date.now();
  localStorage.setItem(KEY + S.name, JSON.stringify(S));
  const rank = JSON.parse(localStorage.getItem(RANK_KEY) || '{}');
  rank[S.name] = { name: S.name, score: S.score, tasks: TASKS.filter(t => isTaskDone(t.id)).length, ts: S.ts };
  localStorage.setItem(RANK_KEY, JSON.stringify(rank));
  const all = JSON.parse(localStorage.getItem(ALL_KEY) || '{}');
  all[S.name] = JSON.parse(JSON.stringify(S));
  localStorage.setItem(ALL_KEY, JSON.stringify(all));
  cloudSync(S);
  updateHUD();
}

function scheduleSave(){
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => { if(S) save(); }, 500);
}

function load(name){
  const raw = localStorage.getItem(KEY + name);
  if(raw){ try{ return normalizeState(JSON.parse(raw), name); }catch(e){} }
  return blankState(name);
}

  if(!cloudEnabled()) return;
  try{
    await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/students?on_conflict=name`, {
      method:'POST',
      headers: Object.assign(cloudHeaders(), { 'Prefer':'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ name: state.name, score: state.score, data: state, updated_at: new Date().toISOString() })
    });
  }catch(e){ console.warn('cloud sync failed', e); }
}
async function cloudFetchAll(){
  if(!cloudEnabled()) return null;
  try{
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/students?select=name,score,data,updated_at&limit=500`, { headers: cloudHeaders() });
    if(!r.ok) return { error: r.status };
    return await r.json();
  }catch(e){ return { error: 'network' }; }
}
async function cloudFetchOne(name){
  if(!cloudEnabled()) return null;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3500);
  try{
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/students?name=eq.${encodeURIComponent(name)}&select=name,score,data,updated_at`, { headers: cloudHeaders(), signal: controller.signal });
    if(!r.ok) return null;
    const arr = await r.json();
    return (arr && arr.length) ? arr[0] : null;
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}

function isTaskDone(id){
  if(!S) return false;
  if(id === 1) return !!(S.t1.v1.trim() && S.t1.v2.trim() && S.t1.v3.trim() && S.t1.v4.trim() && S.t1.s1 === T1_S1_ANS && S.t1.s2 === T1_S2_ANS);
  if(id === 3) return !!(S.t3.m2 !== null && S.t3.phen.trim() && S.t3.concl.trim());
  if(id === 6) return !!S.t6.done;
  if(id === 7) return S.t7.a === T7_A_ANS && S.t7.b === T7_B_ANS;
  return false;
}
function isTaskDoneState(st, id){
  if(!st) return false;
  if(id === 1){ const t = st.t1 || {}; return !!(t.v1 && t.v2 && t.v3 && t.v4 && t.s1 === T1_S1_ANS && t.s2 === T1_S2_ANS); }
  if(id === 3){ const t = st.t3 || {}; return !!(t.m2 !== null && t.phen && t.concl); }
  if(id === 6) return !!(st.t6 && st.t6.done);
  if(id === 7){ const t = st.t7 || {}; return t.a === T7_A_ANS && t.b === T7_B_ANS; }
  return false;
}

/* =========================================================
   6. 拖拽引擎
   ========================================================= */
const Drag = {
  active:null, ghost:null, offX:0, offY:0, w:0, h:0, selected:null,
  init(){
    document.addEventListener('pointerdown', e => this.onDown(e), { passive:false });
    document.addEventListener('pointermove', e => this.onMove(e), { passive:false });
    document.addEventListener('pointerup',   e => this.onUp(e));
    document.addEventListener('pointercancel', e => this.onUp(e));
  },
  onDown(e){
    const el = e.target.closest('[data-drag]'); if(!el) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    this.active = { el, sx:e.clientX, sy:e.clientY, moved:false };
    this.offX = e.clientX - r.left; this.offY = e.clientY - r.top;
    this.w = r.width; this.h = r.height;
  },
  onMove(e){
    const a = this.active; if(!a) return;
    e.preventDefault();
    const dx = e.clientX - a.sx, dy = e.clientY - a.sy;
    if(!a.moved && Math.hypot(dx, dy) < 7) return;
    if(!a.moved){
      a.moved = true;
      const g = a.el.cloneNode(true);
      g.className = 'drag-ghost';
      g.style.width = this.w + 'px'; g.style.height = this.h + 'px';
      document.body.appendChild(g); this.ghost = g; a.el.classList.add('dragging');
    }
    this.ghost.style.left = (e.clientX - this.offX) + 'px';
    this.ghost.style.top  = (e.clientY - this.offY) + 'px';
    this.hover(e.clientX, e.clientY);
  },
  onUp(e){
    const a = this.active; if(!a) return;
    this.active = null;
    if(!a.moved){ this.select(a.el); return; }
    if(this.ghost){ this.ghost.remove(); this.ghost = null; }
    a.el.classList.remove('dragging');
    $$('.drop-hover').forEach(n => n.classList.remove('drop-hover'));
    const zone = this.zoneAt(e.clientX, e.clientY);
    if(zone) zone.dispatchEvent(new CustomEvent('dropitem', { detail:{ item:a.el.dataset.drag }, bubbles:true }));
    else toast('没有放到正确的位置哦～', 'warn');
  },
  zoneAt(x, y){ const el = document.elementFromPoint(x, y); return el ? el.closest('[data-drop]') : null; },
  hover(x, y){ $$('.drop-hover').forEach(n => n.classList.remove('drop-hover')); const z = this.zoneAt(x, y); if(z) z.classList.add('drop-hover'); },
  select(el){
    if(this.selected === el){ el.classList.remove('selected'); this.selected = null; return; }
    if(this.selected) this.selected.classList.remove('selected');
    this.selected = el; el.classList.add('selected');
    toast('已选中，点击目标位置放下', 'info');
  },
  clear(){ if(this.selected){ this.selected.classList.remove('selected'); this.selected = null; } }
};

document.addEventListener('click', e => {
  const zone = e.target.closest('[data-drop]');
  if(zone && Drag.selected){
    zone.dispatchEvent(new CustomEvent('dropitem', { detail:{ item: Drag.selected.dataset.drag }, bubbles:true }));
    Drag.clear();
  }
});

$('#btn-enter').onclick = async () => {

  let restored = false, restoredFrom = '';
  try{

    if(cloudEnabled()){
      const cloudRec = await cloudFetchOne(name);
      if(cloudRec && cloudRec.data){
        const cloudS = normalizeState(cloudRec.data, name);
        const cloudTs = cloudS.ts || (cloudRec.updated_at ? Date.parse(cloudRec.updated_at) : 0) || 0;
        const localTs = localS.ts || 0;
        if(cloudTs > localTs){ localS = cloudS; restored = true; restoredFrom = '云端'; }
      }
    }
    if(!restored && hasContent(localS)){ restored = true; restoredFrom = '本地'; }
    S = normalizeState(localS, name);
    save();
    $('#topbar').classList.add('on');
    updateHUD();
    renderHome();
    show('screen-home');
    if(restored) toast('已找回 ' + name + ' 之前的记录（' + restoredFrom + '）✔', 'ok');
  }finally{
    btn.disabled = false;
    btn.textContent = origText;
  }
};

/* ★ 锥形瓶 SVG：未反应时溶液始终为蓝色，反应后才变浅绿 ★ */
function flask3SVG(t){
  const hasLiquid = t.solution;
  const reacted = t.reacted;

  /* 关键：动画类只在 reacted 为 true 时添加 */
  const liquidClass = reacted ? 't3-liquid' : '';
  const nailClass   = reacted ? 't3-nail' : '';

function t6Table(){

    if(isTaskDone(1)) renderTask(1);

  if(ta3){

    if(isTaskDone(3)) renderTask(3);

  if(currentTask === 3){
    const t = S.t3;

    if(zone === 'nail'){
      if(item === 'paper'){
        if(t.polished){ toast('铁钉已经打磨好了', 'warn'); return; }
        t.polished = true;
        award('t3-polish', SCORE_RIGHT, `铁钉已打磨，+${SCORE_RIGHT} 分`);
        save(); renderTask(3); return;
      }

    if(zone === 'bench' && item === 'balance' && !t.balance){

    if(zone === 'pan' && item === 'flask' && !t.flask){
      if(!t.balance){ logOpError('操作提示：应先把托盘天平放上实验台。'); toast('先放天平哦～', 'warn'); return; }

      save(); renderTask(3); return;
    }
    if(zone === 'pan' && item === 'solution' && t.flask && !t.solution){
      t.solution = true; award('t3-solution', SCORE_RIGHT, `硫酸铜溶液已加入，+${SCORE_RIGHT} 分`);
      save(); renderTask(3); return;
    }
    if((zone === 'flask3' || zone === 'pan') && item === 'tube' && t.solution && !t.tube){
      t.tube = true; award('t3-tube', SCORE_RIGHT, `小试管已放入锥形瓶，+${SCORE_RIGHT} 分`);
      save(); renderTask(3); return;
    }
    if(zone === 'pan' && item === 'stopper' && t.tube && !t.stopper){
      t.stopper = true; award('t3-stopper', SCORE_RIGHT, `瓶口已密封，+${SCORE_RIGHT} 分`);
      save(); renderTask(3); return;
    }
    if(item === 'solution'){
      logOpError('操作提示：应先把锥形瓶放到天平左盘，再倒入硫酸铜溶液。');

    toast('这里不能放这个器材哦～', 'warn'); return;

  if(currentTask === 6 && S.t6.stage === 'setup1'){
    const L = S.t6.l1;
    if(zone === 't6-bench' && item === 't6-balance' && !L.balance){

    if(zone === 't6-pan' && item === 't6-beaker' && !L.beaker){
      if(!L.balance){ logOpError('操作提示：应当先把托盘天平放好，再把烧杯放到左盘。'); toast('先放天平哦～', 'warn'); return; }
      L.beaker = true; save(); renderTask(6); toast('烧杯已放上左盘 ✔', 'ok'); return;
    }
    if(zone === 't6-beaker' && item === 't6-powder' && !L.powder){
      if(!L.beaker){ logOpError('操作提示：应当先把烧杯放上天平左盘，再加入碳酸钠粉末。'); toast('先把烧杯放上左盘哦～', 'warn'); return; }
      L.powder = true; save(); renderTask(6); toast('已加入碳酸钠粉末 ✔', 'ok'); return;
    }
    if(zone === 't6-beaker' && item === 't6-tube' && !L.tube){
      if(!L.powder){ logOpError('操作提示：应当先向烧杯中加入碳酸钠粉末，再放入盛有稀盐酸的小试管。'); toast('先把碳酸钠粉末放进烧杯哦～', 'warn'); return; }

    if(zone === 't6-flask' && item === 't6-tube2' && !L.tube){

      L.tube = true; save(); renderTask(6); toast('稀盐酸试管已放入锥形瓶 ✔', 'ok'); return;

function handleAct(act){
  if(act === 't3-weigh1'){ S.t3.m1 = 156.2; save(); renderTask(3); toast('反应前总质量 m₁ = 156.2 g', 'ok'); return; }
  if(act === 't3-react'){
    S.t3.reacted = true;
    save();
    renderTask(3);
    toast('👀 溶液由蓝色变为浅绿色，铁钉表面出现红色固体', 'ok');
    return;
  }
  if(act === 't3-weigh2'){ S.t3.m2 = 156.2; save(); renderTask(3); toast('反应后总质量 m₂ = 156.2 g', 'ok'); return; }

  if(act === 't6-react1'){ S.t6.stage = 'react1'; save(); renderTask(6); toast('反应开始，注意观察现象！', 'ok'); return; }
  if(act === 't6-to-explain1'){ S.t6.stage = 'explain1'; save(); renderTask(6); toast('天平指针向右偏了……', 'warn'); return; }
  if(act === 't6-to-setup2'){ S.t6.stage = 'setup2'; save(); renderTask(6); return; }
  if(act === 't6-react2'){ S.t6.stage = 'react2'; save(); renderTask(6); toast('反应开始，气球正在鼓起！', 'ok'); return; }
  if(act === 't6-to-explain2'){ S.t6.stage = 'explain2'; save(); renderTask(6); toast('天平竟然还是平衡的！', 'ok'); return; }
  if(act === 't6-to-table'){ S.t6.stage = 'table'; save(); renderTask(6); return; }
}

function handleT1Sel(k, v){
  if(!v) return;
  S.t1[k] = v;
  const ans = k === 's1' ? T1_S1_ANS : T1_S2_ANS;
  const key = 't1-' + k;
  if(v === ans){
    award(key, SCORE_RIGHT, `回答正确，+${SCORE_RIGHT} 分`);
  }else if(!S.awarded[key]){
    S.awarded[key] = true; S.score -= SCORE_WRONG;
    S.ans[key] = { picked: v, correct: false };
    save(); toast(`回答错误，−${SCORE_WRONG} 分，已加入错题巩固`, 'err');
  }
  save(); renderTask(1);
}

function handleT7Sel(k, v){
  if(!v) return;
  S.t7[k] = v;
  const ans = k === 'a' ? T7_A_ANS : T7_B_ANS;
  const key = 't7-' + k;
  if(v === ans){
    award(key, SCORE_RIGHT, `回答正确，+${SCORE_RIGHT} 分`);
  }else if(!S.awarded[key]){
    S.awarded[key] = true; S.score -= SCORE_WRONG;
    S.ans[key] = { picked: v, correct: false };
    save(); toast(`回答错误，−${SCORE_WRONG} 分，已加入错题巩固`, 'err');
  }
  save(); renderTask(7);
}

function handleT6Sel(key, v){
  if(!v) return;
  if(S.ans[key]) return;
  const item = T6_TABLE.find(x => x.key === key);
  const picked = +v;
  const correct = picked === item.ans;
  S.ans[key] = { picked, correct };
  if(correct){ S.score += SCORE_RIGHT; toast(`回答正确，+${SCORE_RIGHT} 分`, 'ok'); }
  else { S.score -= SCORE_WRONG; toast(`回答错误，−${SCORE_WRONG} 分，已加入错题巩固`, 'err'); }
  if(T6_TABLE.every(x => S.ans[x.key])) S.t6.done = true;
  save(); renderTask(6);
}

function logOpError(text){
  if(!S.opErrors.includes(text)) S.opErrors.push(text);
  save();
}

function renderWrong(){

        ${S.opErrors.map(t => `<div class="op-error"><span class="ic">ℹ</span><span>${esc(t)}</span></div>`).join('')}

  }

      let label = '', opts = [], correct = 0, hint = '';
      if(key === 't1-s1'){ label = '波义耳实验未称量什么？'; opts = T1_S1.map(o => o.t); correct = T1_S1.findIndex(o => o.v === T1_S1_ANS);
        hint = '提示：金属在敞口容器中加热后质量增加，是因为它和空气中的氧气结合了。所以他没有称量参加反应的氧气。'; }
      else if(key === 't1-s2'){ label = '波义耳实验的装置是？'; opts = T1_S2.map(o => o.t); correct = T1_S2.findIndex(o => o.v === T1_S2_ANS);
        hint = '提示：波义耳用的容器与空气是相通的，属于敞口装置。'; }
      else if(key === 't7-a'){ label = '验证质量守恒定律，必须发生的是？'; opts = T7_A.map(o => o.t); correct = T7_A.findIndex(o => o.v === T7_A_ANS);
        hint = '提示：质量守恒定律的适用范围是化学变化。'; }
      else if(key === 't7-b'){ label = '有气体参与或生成时要？'; opts = T7_B.map(o => o.t); correct = T7_B.findIndex(o => o.v === T7_B_ANS);
        hint = '提示：有气体参与或生成时，敞口装置会让气体逸散或被忽略，必须使用密闭装置把所有物质一起称量。'; }
      else { const item = T6_TABLE.find(x => x.key === key); if(item){ label = item.label; opts = item.opts; correct = item.ans; hint = '💡 ' + item.hint; } }
      if(!label) return '';
      const optsHTML = opts.map((o, j) =>
        `<div class="opt ${j === correct ? 'correct' : ''} locked">${String.fromCharCode(65 + j)}. ${esc(o)}</div>`
      ).join('');
      return `<div class="q-card">
          <div class="q-title"><span class="q-no">✗</span><span>${esc(label)}</span></div>
          <div class="opts">${optsHTML}</div>

            你已经看过正确答案和提示，本题已记入巩固清单。
          </div>
        </div>`;
    }).join('');
  }
  if(!html) html = `<div class="wrong-empty">🎉 太棒了！<br>目前没有需要巩固的错题，继续保持～</div>`;
  box.innerHTML = html;
}

function renderMonitorTabs(){

async function fetchAllStudents(){
  const local = JSON.parse(localStorage.getItem(ALL_KEY) || '{}');
  const map = {};
  Object.values(local).forEach(s => { if(s && s.name) map[s.name] = s; });
  let cloudState = 'off';
  if(cloudEnabled()){
    const res = await cloudFetchAll();
    if(Array.isArray(res)){
      cloudState = 'ok';
      res.forEach(r => { if(r && r.name && r.data) map[r.name] = r.data; });
    }else{ cloudState = 'error'; }
  }
  return { students: Object.values(map), cloudState };
}

async function renderMonitor(silent){
  const banner = $('#mon-cloud-banner');
  const summary = $('#mon-summary');
  const box = $('#monitor-body');

  const { students, cloudState } = await fetchAllStudents();

  if(!cloudEnabled()){
    banner.className = 'cloud-banner';
    banner.innerHTML = `💾 <b>本机模式</b>：仅显示这台设备上登录过的学生。`;
  }else if(cloudState === 'error'){
    banner.className = 'cloud-banner err';
    banner.innerHTML = `⚠ <b>云端连接失败</b>：请检查 Supabase 项目里是否已创建 <b>students</b> 数据表，且 RLS 允许匿名读写。`;
  }else{
    banner.className = 'cloud-banner';
    banner.innerHTML = `☁️ <b>云端同步已开启</b>：所有设备的数据会实时汇总到此处。`;
  }

  const taskStats = TASKS.map(t => {
    let done = 0, started = 0;
    students.forEach(st => {
      if(isTaskDoneState(st, t.id)) done++;
      if(taskStarted(st, t.id)) started++;
    });
    return { id:t.id, done, started, total:students.length };
  });
  const cur = taskStats.find(x => x.id === monTask) || { done:0, started:0, total:0 };

  summary.innerHTML = `
    学生总数：<b>${students.length}</b> 人 &nbsp;·&nbsp;
    任务 ${monTask}：<span class="hl">${cur.done}</span> 人完成
    / ${cur.started} 人作答 &nbsp;·&nbsp;
    完成率 <span class="hl">${students.length ? Math.round(cur.done / students.length * 100) : 0}%</span>
  `;

  if(!students.length){
    box.innerHTML = `<div class="mon-empty">暂无学生数据。<br>学生登录并开始实验后，这里会实时出现他们的作答内容。</div>`;
    return;
  }

  const list = students
    .filter(st => taskStarted(st, monTask))
    .sort((a, b) => (b.score || 0) - (a.score || 0));

  if(!list.length){
    box.innerHTML = `<div class="mon-empty">目前还没有学生开始任务 ${monTask}。<br>完成作答后会自动出现在这里。</div>`;
    return;
  }

  box.innerHTML = list.map(st => {
    const { rows, total, answered } = taskFields(st, monTask);
    const allDone = answered === total;
    return `
      <div class="mon-card">
        <div class="mon-card-head">
          <div class="nm">${esc(st.name)}</div>
          <div class="pgs ${allDone ? 'all' : ''}">已答 ${answered}/${total}</div>
          <div class="sc">${st.score || 0} 分</div>
        </div>
        <div class="mon-card-body">${rows}</div>
      </div>`;
  }).join('');

  if(!silent) updateHUD();
}

function taskStarted(st, id){
  if(!st) return false;
  if(id === 1){ const t = st.t1 || {}; return !!(t.v1 || t.v2 || t.v3 || t.v4 || t.s1 || t.s2); }
  if(id === 3){ const t = st.t3 || {}; return !!(t.polished || t.balance || t.m1 !== null || t.phen || t.concl); }
  if(id === 6){
    const t = st.t6 || {}; const ans = st.ans || {};
    const anyAns = T6_TABLE.some(x => ans[x.key]);
    return !!(anyAns || (t.l1 && (t.l1.balance || t.l1.beaker)) || (t.l2 && (t.l2.flask || t.l2.balloon)));
  }
  if(id === 7){ const t = st.t7 || {}; return !!(t.a || t.b); }
  return false;
}

function taskFields(st, id){
  const rows = [];
  let total = 0, answered = 0;
  const add = (k, v, cls) => {
    total++;
    const empty = !v || String(v).trim() === '';
    if(!empty) answered++;
    rows.push(`<div class="mon-row">
        <div class="k">${k}</div>
        <div class="v ${empty ? 'empty' : (cls ? cls + ' tag' : '')}">${empty ? '未填写' : esc(v)}</div>
      </div>`);
  };
  const optText = (arr, v) => { const o = arr.find(x => x.v === v); return o ? o.t : ''; };

  if(id === 1){
    const t = st.t1 || {};
    add('装置问题', t.v1); add('称量对象', t.v2); add('证据问题', t.v3); add('改进建议', t.v4);
    add('小结①', optText(T1_S1, t.s1), t.s1 === T1_S1_ANS ? 'right' : (t.s1 ? 'wrong' : ''));
    add('小结②', optText(T1_S2, t.s2), t.s2 === T1_S2_ANS ? 'right' : (t.s2 ? 'wrong' : ''));
  }
  else if(id === 3){
    const t = st.t3 || {};
    add('反应前 m₁', t.m1 !== null && t.m1 !== undefined ? t.m1 + ' g' : '');
    add('反应后 m₂', t.m2 !== null && t.m2 !== undefined ? t.m2 + ' g' : '');
    add('实验现象', t.phen); add('实验结论', t.concl);
  }
  else if(id === 6){
    const ans = st.ans || {};
    T6_TABLE.forEach(item => {
      const a = ans[item.key];
      const txt = a ? item.opts[a.picked] : '';
      const cls = a ? (a.correct ? 'right' : 'wrong') : '';
      add(item.label, txt, cls);
    });
  }
  else if(id === 7){
    const t = st.t7 || {};
    add('① 必须发生', optText(T7_A, t.a), t.a === T7_A_ANS ? 'right' : (t.a ? 'wrong' : ''));
    add('② 气体条件', optText(T7_B, t.b), t.b === T7_B_ANS ? 'right' : (t.b ? 'wrong' : ''));
  }

  return { rows: rows.join(''), total, answered };
}

function exportMonitor(){
  const all = JSON.parse(localStorage.getItem(ALL_KEY) || '{}');
  const students = Object.values(all);
  if(!students.length){ toast('暂无数据可导出', 'warn'); return; }
  const optText = (arr, v) => { const o = arr.find(x => x.v === v); return o ? o.t : ''; };
  const t6Text = (st, key) => {
    const item = T6_TABLE.find(x => x.key === key);
    const a = (st.ans || {})[key];
    return item && a ? item.opts[a.picked] : '';
  };
  const header = ['姓名','总分','任务1-装置','任务1-称量','任务1-证据','任务1-改进',
    '任务1-小结1','任务1-小结2','任务3-m1','任务3-m2','任务3-现象','任务3-结论',
    '任务6-现象','任务6-示数','任务6-原因','任务6-能否验证','任务6-改进',
    '任务7-①','任务7-②'];
  const rows = students.map(st => {
    const t1 = st.t1 || {}, t3 = st.t3 || {}, t7 = st.t7 || {};
    return [
      st.name, st.score || 0,
      t1.v1 || '', t1.v2 || '', t1.v3 || '', t1.v4 || '',
      optText(T1_S1, t1.s1), optText(T1_S2, t1.s2),
      t3.m1 !== null ? t3.m1 : '', t3.m2 !== null ? t3.m2 : '',
      t3.phen || '', t3.concl || '',
      t6Text(st, 't6-phen'), t6Text(st, 't6-change'), t6Text(st, 't6-reason'),
      t6Text(st, 't6-verify'), t6Text(st, 't6-improve'),
      optText(T7_A, t7.a), optText(T7_B, t7.b)
    ];
  });
  const csv = [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `监测数据_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出 CSV 文件', 'ok');
}

/* =========================================================
   17. 二维码（本地生成）
   ========================================================= */
$('#btn-qr').onclick = () => showQR();
$('#btn-qr-login').onclick = () => showQR();

function showQR(){
  const rawUrl = location.href.split('#')[0];
  const isFile = location.protocol === 'file:';
  const isLocalhost = /^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0)(:|\/|$)/i.test(rawUrl);
  const mask = document.createElement('div');
  mask.className = 'modal-mask';

  let warnHTML = '';
  if(isFile){
    warnHTML = `<div class="qr-warn">
        <b>⚠ 当前是本地文件地址</b><br>
        你正在用 file:// 方式打开页面，二维码内容是本地路径，手机扫码无法访问。<br>
        <b>请先把本文件上传到任意静态托管服务（如 Vercel / Netlify / GitHub Pages / Cloudflare Pages）</b>，
        再用上线后的网址打开本页，重新生成二维码即可扫码进入。
      </div>`;
  }else if(isLocalhost){
    warnHTML = `<div class="qr-warn">
        <b>⚠ 当前是本地调试地址</b><br>
        手机和电脑不在同一网络下时，扫码将无法访问。<br>
        如需手机测试，可把电脑 IP 替换到地址栏，或直接部署到公网后生成二维码。
      </div>`;
  }

  mask.innerHTML = `<div class="modal" style="max-width:400px">
      <h3>📱 专属二维码</h3>
      <div class="modal-body">
        <div class="qr-wrap">
          <div class="qr-box"><canvas id="qr-canvas" width="248" height="248"></canvas></div>
          ${warnHTML}
          <div style="font-size:12px;color:#6f8395;margin-bottom:8px;text-align:left;margin-top:14px">
            二维码内容（当前页面地址）：
          </div>
          <div class="qr-url" id="qr-url">${esc(rawUrl)}</div>
          <div style="display:flex;gap:8px">
            <button class="btn" style="flex:1" id="qr-copy">📋 复制链接</button>
            <button class="btn" style="flex:1" id="qr-open">🔗 新窗口打开</button>
          </div>
          <div class="qr-tip">
            <b>使用说明：</b><br>
            • 二维码由本地算法生成，不依赖网络，断网也能显示；<br>
            • 部署到固定网址后，此二维码永久有效；<br>
            • 学生扫码即可直接进入实验室，无需发送任何文件。
          </div>
        </div>
      </div>
      <button class="btn primary" id="qr-close">关闭</button>
    </div>`;
  document.body.appendChild(mask);
  requestAnimationFrame(()=> mask.classList.add('show'));

  try{
    const canvas = mask.querySelector('#qr-canvas');
    QRCode.render(rawUrl, canvas, 220);
  }catch(err){
    console.warn('QR render failed', err);
    mask.querySelector('.qr-box').innerHTML = `<div style="padding:30px 16px;font-size:12px;color:#a54440;line-height:1.8;text-align:center">
        二维码生成失败<br>请直接复制下方链接分享
      </div>`;
  }

  mask.querySelector('#qr-close').onclick = closeQR;
  mask.querySelector('#qr-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(rawUrl); toast('链接已复制', 'ok'); }
    catch(e){
      const r = document.createRange();
      r.selectNodeContents(mask.querySelector('#qr-url'));
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      toast('请手动复制选中的链接', 'warn');
    }
  };
  mask.querySelector('#qr-open').onclick = () => window.open(rawUrl, '_blank');
  mask.onclick = e => { if(e.target === mask) closeQR(); };
  function closeQR(){ mask.classList.remove('show'); setTimeout(()=> mask.remove(), 260); }
}

/* =========================================================
   18. 重置
   ========================================================= */
$('#btn-restart').onclick = () => {
  showModal('清空记录', `
    <p style="text-align:center">确定要清空本次全部实验记录并重新开始吗？<br>
    <span style="font-size:12.5px;color:#6f8395">得分、错题、操作记录都会一起清空。</span></p>
  `, () => {
    const name = S.name;
    S = blankState(name);
    save();
    renderHome();
    show('screen-home');
    toast('记录已清空，可以重新开始', 'ok');
  }, '确定清空');
};

/* =========================================================
   19. 离开前强制保存
   ========================================================= */
window.addEventListener('beforeunload', () => { if(S) save(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && S) save();
});
window.addEventListener('storage', e => {
  if(e.key === RANK_KEY && $('#screen-rank').classList.contains('active')) renderRank();
  if(e.key === ALL_KEY && $('#screen-monitor').classList.contains('active')) renderMonitor(true);
});

   20. 启动
   ========================================================= */
Drag.init();
updateHUD();
